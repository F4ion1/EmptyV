esphome:
  name: waveshare-audio-s3
  friendly_name: Waveshare AI Speaker
  min_version: 2024.6.0
  name_add_mac_suffix: true
  project:
    name: "waveshare.esp32_s3_audio_board"
    version: "1.0"
  on_boot:
    # Ensure Amplifier is enabled on boot
    priority: 600
    then:
      # Configure TCA9555 Pin 8 (P10) as Output (Register 0x07 = 0xFE)
      - lambda: |
          uint8_t data[] = {0x07, 0xFE};
          id(bus_a).write(0x20, data, 2);
      - switch.turn_on: amplifier_power

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

